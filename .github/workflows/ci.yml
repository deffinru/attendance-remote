name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print Python version and commit
        run: |
          python --version
          echo "Commit SHA: ${{ github.sha }}"
      - name: Compile all Python files
        run: |
          python -m py_compile $(find . -name "*.py")
      - name: Check UTF-8 encoding
        run: |
          python check_utf8.py

  unit_tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - name: Run unit tests
        run: |
          python -m unittest discover -s . -p "test_*.py" -v
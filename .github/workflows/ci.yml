name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print Python version and commit
        run: |
          python --version
          echo "Commit SHA: ${{ github.sha }}"
      - name: Compile all Python files
        run: |
          python -m py_compile $(find . -name "*.py")
      - name: Check UTF-8 encoding
        run: |
          python check_utf8.py

  unit_tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: |
          python -m unittest discover -s . -p "test_*.py" -v

  package:
    runs-on: ubuntu-latest
    needs: [validate, unit_tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create dist directory
        run: mkdir dist
        
      - name: Copy approved files
        run: |
          cp attendance.py dist/
          cp README.md dist/
          cp Dockerfile dist/
          cp attendance.csv.example dist/
          
      - name: Generate manifest.txt
        run: |
          echo "Commit SHA: ${{ github.sha }}" > dist/manifest.txt
          echo "Pipeline ID: ${{ github.run_id }}" >> dist/manifest.txt
          echo "Files:" >> dist/manifest.txt
          ls -1 dist/ | grep -v manifest.txt >> dist/manifest.txt
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/
          retention-days: 7